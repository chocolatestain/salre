<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="EUC-KR">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 임대차 전자계약서</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <h1>부동산 전자계약서</h1>
        
        <!-- 계약 정보 -->
        <section class="section">
            <h2>계약 정보</h2>
            <div class="form-row">
                <label for="contract_type">계약 유형:</label>
                <select id="contract_type">
                    <option value="임대차">임대차</option>
                    <option value="매매">매매</option>
                </select>
            </div>
            <div class="form-row">
                <label for="payment_type">거래 유형:</label>
                <select id="payment_type">
                    <option value="월세">월세</option>
                    <option value="전세">전세</option>
                </select>
            </div>
        </section>

        <!-- 부동산의 표시 -->
        <section class="section">
            <h2>1. 부동산의 표시</h2>
            <div class="form-grid">
                <div>
                    <label for="address">소재지:</label>
                    <input type="text" id="address" name="address">
                </div>
                <div>
                    <label for="land_area">대지면적:</label>
                    <input type="text" id="land_area" name="land_area">
                </div>
                <div>
                    <label for="building_area">건물면적:</label>
                    <input type="text" id="building_area" name="building_area">
                </div>
                <div>
                    <label for="building_usage">건물 용도:</label>
                    <select id="building_usage">
                        <option value="주거용">주거용</option>
                        <option value="상업용">상업용</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- 계약 내용 -->
        <section class="section">
            <h2>2. 계약 내용</h2>
            <div class="form-grid">
                <div>
                    <label for="deposit">보증금:</label>
                    <input type="text" id="deposit" name="deposit">
                </div>
                <div>
                    <label for="rentfee">월세:</label>
                    <input type="text" id="rentfee" name="rentfee">
                </div>
                <div>
                    <label for="start_date">계약 시작일:</label>
                    <input type="date" id="start_date" name="start_date">
                </div>
                <div>
                    <label for="end_date">계약 종료일:</label>
                    <input type="date" id="end_date" name="end_date">
                </div>
            </div>
        </section>

        <!-- 특약사항 -->
        <section class="section">
            <h2>기타사항</h2>
            <textarea id="special_terms" name="special_terms" rows="5" placeholder="특약사항 입력"></textarea>
        </section>

        <!-- 제출 버튼 -->
        <div class="button-group">
            <button type="button" class="btn">미리보기</button>
            <button type="submit" class="btn">임시저장</button>
            <button type="submit" class="btn btn-primary">계약서 생성</button>
        </div>
    </div>
</body>
</html>
